version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: nexora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_pass
      POSTGRES_DB: nexora_ai
    ports:
      - '5432:5432'
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexora -d nexora_ai']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for DB inspection
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexora_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexora.ai
      PGADMIN_DEFAULT_PASSWORD: nexora_admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  nexora_pgdata:
